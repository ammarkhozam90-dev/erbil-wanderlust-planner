name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Supabase settings exist
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing GitHub secrets: VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm add -w @capacitor/core@8.5.3 @capacitor/android@8.5.3 @capacitor/app@8.1.2 @capacitor/browser@8.0.5
          pnpm add -w -D @capacitor/cli@8.5.3

      - name: Build web app (mobile)
        run: node scripts/build-mobile.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add sign-in deep link to Android
        run: node scripts/patch-android.mjs

      - name: Generate app icon and splash
        run: npx --yes @capacitor/assets@3.0.5 generate --android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: erbilgo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
